# .github/workflows/kaldi.yml
name: kaldi-sale-checker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 21 */3 * *'    # 3日おきJST 6:00頃 (UTC 21:00)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Restore seen.db
        uses: actions/cache/restore@v5
        with:
          path: seen.db
          key: kaldi-seen-db-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kaldi-seen-db-v2-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Run scraper.py
        env:
          LINE_TOKEN:   ${{ secrets.LINE_TOKEN }}
        run: |
          python scraper.py

      - name: Save seen.db
        uses: actions/cache/save@v5
        with:
          path: seen.db
          key: kaldi-seen-db-v2-${{ github.run_id }}-${{ github.run_attempt }}
